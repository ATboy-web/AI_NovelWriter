# AI_NovelWriter 单一 CI/CD 流水线
#
# 本文件是仓库唯一的工作流。原 build.yml 与 ci-cd.yml 已于 2026-09 删除：
#   - 三者触发条件与作业高度重叠，同时启用会让每次 push 跑三套流水线；
#   - ci-cd.yml 引用不存在的根 requirements.txt，其 lint/test 必然失败，
#     导致 CI 状态不可信、回归无法拦截；
#   - ci-cd.yml 的 build/deploy 作业为死代码（上游 test 恒失败故从未执行），
#     且与 docker-compose.prod.yml 的源码 build 模式不匹配
#     （对 build-only 服务执行 docker-compose pull 无效）。
#
# 触发：
#   push / PR        -> lint + test + android + security
#   tag v*           -> 上述全部 + 构建 EXE 并创建 Release
#
# 依赖安装统一使用 pyproject.toml（pip install -e ".[dev]"），
# 不再引用并不存在的根目录 requirements.txt。

name: CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ---------- 代码质量 ----------
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        # ❗ 必须 pin 版本：`pip install ruff` 取最新，上游一旦发新规则
        # （实测 0.16.7 → 0.17.6 新增规则），全仓立刻变红，而代码并没有问题。
        # lint 工具升级应当是一次**有意的改动**：改这里的 pin → 本地修完规则 → 再提交。
        run: pip install "ruff==0.16.7" mypy

      - name: Ruff check
        run: ruff check app/ tests/ backend/ scripts/ --output-format=github

      # 2026-09-16 起为**阻断式**：全仓已完成一次 `ruff format`（143 文件全部达标），
      # 之后任何未格式化的改动都会在这里失败 —— 这条门禁才真正有意义。
      # 2026-09-17 扩到 `scripts/`：发布脚本（release_notes.py / fix_release_metadata.py）
      # 也是长期维护的代码，格式一致性不该漏掉它们（`ruff check` 早已覆盖 scripts/）。
      # 2026-11-21 扩到 `backend/`（P2-10）：此前 check 覆盖 backend 而 format 不覆盖，
      # 等于后端 53 个文件长期游离在格式门禁之外；已一次性格式化达标后纳入。
      - name: Ruff format check
        run: ruff format --check app/ tests/ backend/ scripts/

      # P2-10：mypy 由"整步非阻断"改为**分模块阻断**。
      # 整体仍有 643 条存量错误，一次性转阻断只会让 CI 长期红着；
      # 但整步 continue-on-error 会让**新增代码**的类型错误也漏过去。
      # 故对 scripts/mypy_blocking_modules.txt 里"当前零错误"的核心模块阻断，
      # 清单只增不减，存量逐步收敛。
      - name: Mypy (blocking subset)
        run: |
          grep -v '^#' scripts/mypy_blocking_modules.txt | grep -v '^[[:space:]]*$' \
            | xargs mypy --ignore-missing-imports --follow-imports=silent

      # ⚠️ 整体仍为**非阻断**：存量错误集中在
      # app/generation_ui.py、app/format_converter.py、app/lifecycle_ui.py、
      # app/character_ui.py、app/novel_agent.py 等（清单外的模块）。
      # 每修完一个模块就把它加进上面的清单，直到本步可以删除。
      - name: Mypy type check (advisory)
        run: mypy app/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # ---------- 单元测试 ----------
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.11', '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # 显式列出两个测试目录：pyproject 的 testpaths 只在无参数运行时生效，
        # 历史上写成 `pytest tests/` 导致 backend/tests 从未在 CI 中执行。
        run: |
          python -m pytest tests/ backend/tests/ -v --tb=short \
            --cov=app --cov-report=xml --cov-report=json --cov-report=term-missing

      - name: Coverage gate
        # 2026-09-17 起为**阻断式**。此前覆盖率可以任意下降而无人拦截：
        # `[tool.coverage.report]` 没有 fail_under，且下面的 codecov 步骤写了
        # `fail_ci_if_error: false` ⇒ 连上传失败都不拦。
        #
        # 阈值**只在 pyproject.toml 里定义一处**，本步骤不重复写数字
        # （"同一事实写两处必然漂移"已被本项目验证过三次）。
        # 该脚本还会反向检查「实测高出阈值 2 个百分点就失败并提示收紧」，
        # 避免真实覆盖率上涨后阈值长期不动、门禁退化成橡皮图章。
        run: python scripts/check_coverage.py --report coverage.json

      # P0-2：门禁只看"计入口径"，而 pyproject 的 omit 排除了 44 个 UI 模块
      # （11042 语句，占 app 语句的 42%）。只打印前者会让 86% 被误读成
      # "整个桌面端测到 86%"——实测全 app 口径只有 50%。
      # 本步不改判定，只把真实风险面**摆到 CI 日志里**，并给出补测优先级。
      - name: Coverage visibility (full-app scope)
        run: python scripts/coverage_visibility.py --report coverage.json --json-out coverage_visibility.json

      # P1-6：后端此前从不计覆盖率（--cov=app 只统计桌面端）。
      # 单独跑一遍 backend/tests 并出报告：与桌面端门禁**互不干扰**
      # （合并分母会让 app 的阈值失去意义），先建立可见性再谈阈值。
      # 注意：服务入口测试用子进程隔离（两个服务的包名都叫 app），
      # 子进程内的执行不计入本报告，故这里反映的是进程内可测部分。
      - name: Backend coverage (visibility)
        # 用后端专用 rc（backend/.coveragerc，其中 fail_under=0），
        # 不在命令行传覆盖率阈值参数：tests/test_coverage_gate.py 明确禁止那样做
        # （会制造第二个阈值真相源）。根 pyproject 的阈值是**桌面端**的，不适用于后端。
        run: |
          COVERAGE_RCFILE=backend/.coveragerc python -m pytest backend/tests/ -q \
            --cov=backend --cov-report=json:coverage-backend.json --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          # 上传失败不阻断（本次由 Coverage gate 承担判定职责）；
          # 若哪天 codecov 不可用，覆盖率门禁仍然有效。
          fail_ci_if_error: false

  # ---------- Android 构建验证 ----------
  build-android:
    name: Android Build (debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 不再使用 android-actions/setup-android@v3。
      # 该 action 会执行 `sdkmanager tools`，而 Google 已从 SDK 仓库下线独立的
      # `tools` 包（现由 cmdline-tools 取代），导致它必然报
      # "Warning: Failed to find package 'tools'" 并以 exit 1 失败 —— 属上游
      # 停止维护导致的稳定性问题，与本项目代码无关。
      # ubuntu-latest 镜像本身已预装 Android SDK（含 cmdline-tools，许可已接受），
      # 缺失的 platform/build-tools 由 AGP 自动补齐，因此只需定位 SDK 路径。
      - name: Locate Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            for d in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$d" ]; then
                echo "ANDROID_HOME=$d" >> "$GITHUB_ENV"
                echo "ANDROID_SDK_ROOT=$d" >> "$GITHUB_ENV"
                break
              fi
            done
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null || true

      - name: Build Android App
        working-directory: mobile-app/novel-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile-app/novel-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # ---------- 安全扫描 ----------
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        # P2-10：原先用 `@main` —— 上游任何一次提交都会直接改变本仓的扫描行为，
        # 与 ruff 必须 pin 的理由完全相同。改为 pin 到发布 tag，升级是一次有意的改动。
        uses: trufflesecurity/trufflehog@v3.99.9
        with:
          extra_args: --only-verified

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check dependencies
        # P2-10：safety 换成 pip-audit（safety 的免费漏洞库已受限，扫描结果不可信）。
        # 更关键的是：原步骤**没有安装任何依赖**就扫描，扫的是一个空环境，
        # 无论工具是谁都不可能发现问题。这里先按 pyproject 装齐再审计。
        # 暂保持非阻断：首次真实报告需要先人工过一遍（含传递依赖的既有 CVE），
        # 确认无阻断项后再去掉 continue-on-error。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
          pip-audit --progress-spinner off --format columns
        continue-on-error: true

  # ---------- 发布：构建 EXE 并创建 Release（仅 tag） ----------
  release:
    name: Build EXE & Release
    needs: [ lint, test ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build deps
        # ⚠️ 此前只装 `pyinstaller loguru` 就构建 —— 打出的 EXE **缺少运行时依赖**
        # （httpx / Pillow / cryptography / python-docx / pypdf / ebooklib / fpdf2 …）。
        # 由于 `app/__init__.py` 对导入失败采用 `_ImportStub` 降级而非崩溃，
        # 这种残缺包不会报错，只会让对应功能静默失效（导出、加密配置、图片处理等）。
        # 故必须按 pyproject 安装完整依赖后再打包。
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build EXE
        run: |
          cd installer
          pyinstaller novel_app.spec --clean --noconfirm

      - name: Generate release notes from CHANGELOG
        # 发布说明**由 CHANGELOG 派生**，不另写一份：同一事实写两处必然漂移
        # （README 下载表指向旧版本、docs 索引多出陈旧条目都属此类）。
        # 此前用的是 `generate_release_notes: true`，自动生成的正文对直推仓库
        # 只有一行 "Full Changelog"（实测 88 字符），等于没有发布说明。
        shell: bash
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" --out release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: installer/dist/AI_NovelWriter.exe
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- 状态汇总 ----------
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [ lint, test, build-android, security ]
    if: always()
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.lint.result }}" == "failure" ] || \
             [ "${{ needs.test.result }}" == "failure" ] || \
             [ "${{ needs.build-android.result }}" == "failure" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed"
