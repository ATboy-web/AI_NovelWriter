[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-writer"
version = "3.4.1"
description = "AI 长篇小说创作工坊：135 类题材（可自定义）、5 Agent 协作、世界线分支与 20 面板工作台"
requires-python = ">=3.11"
# P2-10：运行期依赖统一加**主版本上界**。原先只有下界（`httpx>=0.24` 之类），
# 意味着任何一次全新安装都可能拿到破坏性大版本（httpx 1.0 / Pillow 13 …），
# 而 CI 与用户装到的版本会不一致。上界按"当前实测可用的大版本"设定，
# 升级大版本必须是一次有意的改动（改这里 → 跑全量 → 再提交）。
dependencies = [
    "httpx>=0.24,<1.0",
    "loguru>=0.7.0,<1.0",
    "python-docx>=0.8.11,<2.0",
    "pypdf>=3.0,<7.0",
    "ebooklib>=0.18,<1.0",
    # P1-5: 删除 markdown —— 全仓（app/backend/scripts/installer）零处 import markdown，
    # 属于纯挂名依赖，只会扩大安装体积与安全面。
    # P1-5: beautifulsoup4 移入 dev —— 唯一使用者是 scripts/check_bundle.py（构建期校验），
    # 运行期不需要；ebooklib 自身也会按需带上它。
    "Pillow>=9.0,<13.0",
    "cryptography>=41.0,<50.0",
    # PDF **导出**用（`app/format_converter.py` 的 `_to_pdf` 里 `from fpdf import FPDF`）。
    # ❗ 原先漏声明：`_to_pdf` 对 ImportError 是**静默降级成 TXT**，
    # 于是"选 PDF 导出"会得到一个 .txt 且不报错（审计实测：fpdf 未安装也未声明）。
    # 包名是 fpdf2，import 名是 fpdf —— 两者不同名，别写错。
    "fpdf2>=2.7.0,<3.0",
]

[project.optional-dependencies]
# 【第二轮优化】chromadb 从强制依赖移入可选 extra。
# 依据：桌面端 app/ 全仓零处 import chromadb（installer/novel_app.spec 反而把它
# 列进 excludes），唯一使用者是 backend/novel-service（自带 requirements.txt
# 固定 chromadb==0.4.22 并做 try/except 可选导入）。此前它让每个桌面用户都
# 被迫安装一个数百 MB、永不使用的重型依赖。
vector = ["chromadb>=0.4.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.1.0",
    "mypy>=1.0",
    # backend/tests 需要导入 backend/shared/middleware（FastAPI/Starlette 中间件）
    # 与 JWT 验签逻辑，否则该目录下的测试在 CI 中无法收集。
    "fastapi>=0.110",
    "PyJWT>=2.8",
    # P1-6: 两个后端服务的 app/core/config.py 用 pydantic_settings.BaseSettings，
    # app/main.py 顶层 import uvicorn。二者此前不在 dev 里，导致 CI 中
    # **两个 FastAPI 应用根本无法被导入**，服务入口长期零测试覆盖。
    "pydantic-settings>=2.1",
    "uvicorn>=0.24",
    # 构建期脚本 scripts/check_bundle.py 解析 HTML 用（运行期不需要）。
    "beautifulsoup4>=4.12",
]

# flat-layout 下存在多个顶层目录 (app / backend / shared / installer / ...),
# 若不加约束 setuptools 会因 "Multiple top-level packages discovered" 拒绝构建,
# 导致 `pip install -e ".[dev]"` 失败 (CI 曾因此静默回退到不完整的依赖安装)。
# 本项目仅 app/ 是需要安装的发行包, backend/ 为独立服务, shared/ 由服务各自引用。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = "test_*.py"
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# 豁免项及理由（均为"无功能影响"的存量风格问题，不阻断 CI）：
#   E501 行长度      —— 由 formatter 处理，不作为硬性门禁
#   E701/E702 一行多语句 —— `if x: return` 类紧凑写法，属可读性偏好而非缺陷
#   W291/W293 行尾/空行含空白 —— 无功能影响。2026-09-16 全量 `ruff format` 后实测：
#       W293 已清零，仅剩 **10 处 W291**，且全部位于**字符串字面量内部**
#       （`app/format_converter.py` 的 HTML/CSS 模板 9 处 + `app/novel_agent.py:1730` 1 处）。
#       ruff 对这些也报 "No fixes available"（只能 `--unsafe-fixes`）——
#       即：修它就会改变模板内容，故**保留豁免**而不是"修掉"。
ignore = ["E501", "E701", "E702", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
# app/__init__.py 先求值 __version__ 再做子模块导入，以规避循环导入，属有意设计
"app/__init__.py" = ["E402"]
# 服务包初始化同样先设版本/元信息再导入子模块
"backend/ai-service/app/__init__.py" = ["E402"]
"backend/novel-service/app/__init__.py" = ["E402"]
# 该模块用 try/except ImportError 包裹一组导入，用来探测"新功能"子模块是否可用；
# 导入本身就是探测手段，不能删除（故豁免 F401）。
"backend/novel-service/app/api/new_features_routes.py" = ["F401"]
# 启动器同样用 try/except ImportError 探测 tkinter 子模块与 psutil 是否可用
# （`HAS_TKINTER` / `HAS_PSUTIL` 这两个开关就是探测结果），导入即探测，不能删除。
"installer/launcher.py" = ["F401"]
# 冒烟脚本必须**先**把 backend/novel-service/app 插进 sys.path，
# 否则 `from generators...` 找不到模块（该目录下的包名也叫 `app`，
# 不能提前导入）。导入顺序是运行前提，不是风格问题。
"scripts/smoke_generators.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# UI 粘合层（Tkinter 窗口/事件/带副作用的网络与磁盘操作）不计入覆盖率：
# 这些模块难以单测；其可测的业务逻辑已抽取到独立模块（如 app/parsing.py）。
omit = [
    # panels：2026-11-23 起按实测覆盖率精确排除（探针数据见下）。
    # 已纳入门禁（实测 ≥84%）：__init__.py(100%) / layout.py(99%) /
    # registry.py(98%) / legacy.py(95%) / host.py(84%，面板宿主框架) ——
    # 这 5 个文件共 787 语句进入口径，host 作为全部 20 面板的宿主最值得看住。
    # 仍排除的是构建/交互主体（探针实测 <75%，base 已于同日纳入见下）：ui_kit、
    # skill_library_panel 60%、plugin 54%、mcp 53%、lineage 47%、
    # illustration 43%、timeline 42%、rework 40%、biography 38%、
    # style 26%、descriptions/dialogue 17%、memory_viz 16%、
    # adapt/story_flow 15%、bridges 14%、elements 12%、websearch 11%、
    # batch_ops 10%、summary_mgmt 8%、chapter_analysis 6%。
    # ui_kit 仍排除：2026-11-25 把 polish_legacy 的 isinstance 链重构成
    # 「winfo_class → handler」表分发后，**润色分发部分已可假控件测试**
    # （tests/test_ui_kit_polish_dispatch.py 42 条，覆盖 22 个分支）。
    # 但 card/button/search_entry/toast/pretty_tree 等仍要真 Tk 才能执行，
    # 无显示环境实测仅 41.5% ⇒ 纳入会把 CI 拉到门禁以下。等这些工厂函数
    # 也拆出可测的纯逻辑后，再重新评估纳入。
    "app/panels/ui_kit.py",
    # base.py 已于 2026-11-23 纳入：33 条契约测试钉住代理语义
    # （tests/test_panel_base_contract.py，无显示依赖）。
    "app/panels/skill_library_panel.py",
    "app/panels/plugin_panel.py",
    "app/panels/mcp_panel.py",
    "app/panels/lineage_panel.py",
    "app/panels/illustration_panel.py",
    "app/panels/timeline_panel.py",
    "app/panels/rework_panel.py",
    "app/panels/biography_panel.py",
    "app/panels/style_panel.py",
    "app/panels/descriptions_panel.py",
    "app/panels/dialogue_panel.py",
    "app/panels/memory_viz_panel.py",
    "app/panels/adapt_panel.py",
    "app/panels/story_flow_panel.py",
    "app/panels/bridges_panel.py",
    "app/panels/elements_panel.py",
    "app/panels/websearch_panel.py",
    "app/panels/batch_ops_panel.py",
    "app/panels/summary_mgmt_panel.py",
    "app/panels/chapter_analysis_panel.py",
    "app/fullscreen_writer.py",
    "app/ui_style.py",
    "app/navigation.py",
    "app/design_tokens.py",
    "app/writing_skills_panel.py",
    # P2-1 巨石拆分产生的功能域 Mixin
    "app/shell_ui.py",
    "app/lifecycle_ui.py",
    "app/generation_ui.py",
    "app/character_ui.py",
    "app/outline_ui.py",
    "app/chapter_ui.py",
    "app/editor_ui.py",
    "app/reader_ui.py",
    "app/timeline_ui.py",
    "app/toolkit_ui.py",
    "app/note_ui.py",
    # persistence_ui 已于 2026-11-23 纳入门禁：全部方法为纯逻辑
    # （备份/检查点/断电恢复），tests/test_persistence_backup.py 用假宿主
    # 完整覆盖，无显示环境同样可跑（同 theme_switch 路径）。
    # ⚠️ outline_ui 暂不纳入：纯函数已测（test_outline_context_logic.py），
    # 但 Tk 构建部分未测，整文件计入会把 CI 无显示口径拉到 86.0 门禁以下。
]

[tool.coverage.report]
show_missing = true
precision = 1
# ---- 覆盖率阈值门禁（唯一权威，CI 与本地都从这里读）----
# 2026-09-17 首次建立。此前覆盖率**可以任意下降而无人拦截**：
#   - 本段没有 fail_under；
#   - CI 的 codecov 步骤写了 `fail_ci_if_error: false`（上传失败都不拦）。
# 于是"覆盖率"只是一份没人看的报告。
#
# 基线来源：单进程全量跑（`pytest tests/ backend/tests/ --cov=app`）
#   2026-09-17 首次建立：74.56%（9384 语句），阈值取 73，留约 1.5 个百分点缓冲。
#   2026-09-18 v3.2.0：升至 **76.33%**（11254 语句 / 2664 未覆盖）——
#     本轮新增模块自带密集测试（genres 90.5% / mcp_system 89.6% / plugin_system 84.1%），
#     覆盖率被拉高后**高于 73+2 的上界 ⇒ ratchet 触发**（这正是该检查的设计目的）。
#   阈值上调到 **75**，理由：
#     - 实测最低平台值是 CI 的 Linux（无显示，63 条 Tk 用例跳过）≈ **76.01%**
#       （已实测：全量 76.33% vs 去 Tk 76.01%，Tk 只值 0.32 个百分点）；
#     - 取 75 使 Windows(76.33) 与 Linux(76.01) **都落在 [75, 77] 内**且有 1 个百分点余量，
#       避免"按单平台实测值卡死阈值"导致另一个平台立刻变红。
#     ⚠️ 不要直接用 `check_coverage.py --update`（它写 round(actual,1)=76.3）：
#       那会让 Linux 的 76.01 低于阈值而失败 —— **阈值必须按最低平台值定**。
#   2026-11-17 技能库（第 19 面板）：升至 **77.20% / CI 口径 76.90%**（+0.88）——
#     `skill_library.py` 自带 74 条密集测试（含安全边界与接线守卫），覆盖被拉高后
#     **77.20 > 75+2 的上界 ⇒ ratchet 再次触发**。
#   阈值上调到 **76**，理由同上一轮：
#     - 实测 Windows 全量 **77.20%**，去掉 Tk 用例（≈ Linux CI）**76.90%**；
#     - 取 76 使两者落在 [76, 78]：Windows 富余 1.2，Linux 富余 0.9；
#     - 取 75 会让 Windows 的 77.20 超过上界 77.0 ⇒ **本地门禁变红**（本轮实测踩到）。
#   2026-11-17 审查修复（云存储 / 解析 / 脱敏等 20 项）：升至
#     **78.70%（Windows 全量）/ 78.40%（CI 口径）**（+1.50）——
#     `cloud_storage` 32% → 53.9%、`parsing` 91.4% → 95.0%、
#     `format_converter` 17.4% → 31.6%，并新增 104 条回归测试。
#   阈值上调到 **77.5**：
#     - 仍按**最低平台**（Linux CI 78.40）定，留 0.9 个百分点缓冲；
#     - Windows 78.70 富余 1.20，且低于上界 79.5 ⇒ 不触发 ratchet。
#     - 不取 78.4/78.7 这类实测值：那等于"按单平台卡死"，任何小重构都会让另一平台变红。
#   2026-11-17 采纳写作能力建议（风格 DNA / 语义候选 / 两段式 / 门禁校准）：
#     升至 **79.50%（Windows 全量）/ 79.23%（CI 口径）**（+0.83）——
#     新增 `style_dna` 95.4%、`semantic_candidates` 97.0%、`writing_presets` 84.4%，
#     三个模块都由密集单测覆盖（不是"跑过行"那种）。
#   2026-11-17 专项补覆盖率（7 个新测试文件 / 309 条）：
#     升至 **85.73%（Windows 全量）/ 85.45%（CI 口径）**（+6.23）——
#     character_system 46.7→84.7、cloud_storage 53.9→84.2、format_converter 31.6→92.5、
#     novel_toolkit 43.5→95.0、writing_presets 84.4→92.5、memory_manager 83.4→87.2。
#   阈值上调到 **84.5**：
#     - 按最低平台（CI 85.45）留 1.00 缓冲；
#     - Windows 85.73 富余 1.23，上界 86.5 ⇒ 不触发 ratchet。
#     - 不再逐轮追高：85% 之后剩余缺口集中在 Tk 界面（ai_settings_ui 11.6% /
#       dialogs 27.4% / usage_ui 41.7%），需 Tk 测试隔离框架才能安全推进。
# ⚠️ 必须**单进程**跑才是真实值。分块跑（沙箱删档守卫所迫）只覆盖到 40.7%，
#    那是严重低估——因为它只统计"被跑到的模块"。
#
# 判定由 scripts/check_coverage.py 执行，它额外做了「阈值也要往上走」的反向检查：
# 实测超过 fail_under + 2 个百分点即失败并提示收紧，防止门禁退化成橡皮图章。
#   2026-11-20 全仓审计补测（theme_switch 56.3→92%+ / image_generator 73.9→95%+，
#     新增 79 条回归与补测用例）：升至 **86.77%（Windows，-k "not Tk" 口径）**——
#     86.77 > 84.5+2 的上界 ⇒ ratchet 触发。阈值上调到 **85.5**：
#     - 按最低平台估算（Linux CI ≈ 86.5，Windows 减平台分支差）留约 1.0 缓冲；
#     - Windows 86.77 富余 1.27，上界 87.5 ⇒ 不触发 ratchet；
#     - 不取脚本建议的 85.8（那是 actual-1 的单平台值），避免按单平台卡死。
#   2026-11-21 全部修复（P0-1…P2-10，新增 5 个测试文件 / 84 条用例）：
#     升至 **89.39%（Windows）/ 86.90%（排除新增 Tk 用例，≈ Linux CI）**——
#     ai_settings_ui 11.6% → 83.7%（巨石拆分后首次可测）、dialogs 31.2% → 大幅提升，
#     另加云存储客户端缓存 / 降级留痕 / 切分收敛 / 分层守卫等回归。
#   阈值上调到 **86.0**：
#     - 仍按**最低平台**定：Linux 口径实测 86.90，留 0.9 个百分点缓冲；
#     - Windows 89.39 富余 3.39 —— 超过旧棘轮余量 2.0，故同步把
#       `scripts/check_coverage.py` 的 RATCHET_MARGIN 调到 4.0（见该处注释：
#       两平台实测差 2.49 个百分点，旧余量下两边不可能同时通过）。
fail_under = 86.0