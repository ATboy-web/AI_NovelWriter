[project]
name = "ai-novel-writer"
version = "2.14.2"
description = "AI自动写小说系统"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24",
    "loguru>=0.7.0",
    "python-docx>=0.8.11",
    "pypdf>=3.0",
    "ebooklib>=0.18",
    "markdown>=3.4",
    "beautifulsoup4>=4.12",
    "Pillow>=9.0",
    "chromadb>=0.4.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # 忽略行长度限制

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = [
    "app/panels/*",
    "app/fullscreen_writer.py",
    "app/ui_manager.py",
    "app/ui_style.py",
    "app/navigation.py",
    "app/design_tokens.py",
    "app/note_manager_ui.py",
    "app/reader_manager.py",
    "app/writing_skills_panel.py",
    "app/settings_manager.py",
    "app/character_manager.py",
]

[tool.coverage.report]
show_missing = true
precision = 1