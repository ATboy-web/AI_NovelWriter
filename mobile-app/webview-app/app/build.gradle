plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ainovelwriter'
    compileSdk 35

    defaultConfig {
        applicationId "com.ainovelwriter.app"
        minSdk 24
        targetSdk 35
        versionCode 29
        versionName "3.0.1"
    }

    signingConfigs {
        release {
            storeFile file("${project.rootDir}/../ai-novel-writer-release.keystore")
            storePassword 'ainovel123'
            keyAlias 'ainovelwriter'
            keyPassword 'ainovel123'
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    aaptOptions {
        noCompress "js", "css", "html", "json", "bundle", "png", "jpg", "jpeg", "gif", "ttf", "otf", "woff", "woff2"
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
