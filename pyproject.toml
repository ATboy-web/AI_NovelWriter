[project]
name = "ai-novel-writer"
version = "2.16.0"
description = "AI自动写小说系统"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24",
    "loguru>=0.7.0",
    "python-docx>=0.8.11",
    "pypdf>=3.0",
    "ebooklib>=0.18",
    "markdown>=3.4",
    "beautifulsoup4>=4.12",
    "Pillow>=9.0",
    "chromadb>=0.4.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = "test_*.py"
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # 忽略行长度限制

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# UI 粘合层（Tkinter 窗口/事件/带副作用的网络与磁盘操作）不计入覆盖率：
# 这些模块难以单测；其可测的业务逻辑已抽取到独立模块（如 app/parsing.py）。
omit = [
    "app/panels/*",
    "app/fullscreen_writer.py",
    "app/ui_style.py",
    "app/navigation.py",
    "app/design_tokens.py",
    "app/writing_skills_panel.py",
    # P2-1 巨石拆分产生的功能域 Mixin
    "app/shell_ui.py",
    "app/lifecycle_ui.py",
    "app/generation_ui.py",
    "app/character_ui.py",
    "app/outline_ui.py",
    "app/chapter_ui.py",
    "app/editor_ui.py",
    "app/reader_ui.py",
    "app/timeline_ui.py",
    "app/toolkit_ui.py",
    "app/persistence_ui.py",
    "app/note_ui.py",
]

[tool.coverage.report]
show_missing = true
precision = 1