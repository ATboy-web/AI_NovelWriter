# GitHub Actions CI/CD 配置
# 自动运行测试、lint检查、构建验证

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Python测试
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" 2>/dev/null || pip install -e .
        pip install cryptography pytest pytest-cov
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short --cov=app --cov-report=xml
    
    - name: Upload coverage
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # 代码质量检查
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
    
    - name: Install lint tools
      run: |
        pip install ruff mypy
    
    - name: Ruff lint
      run: |
        ruff check app/ tests/ --output-format=github
    
    - name: Ruff format check
      run: |
        ruff format --check app/ tests/
      continue-on-error: true
    
    - name: Type check
      run: |
        mypy app/ --ignore-missing-imports --no-error-summary
      continue-on-error: true

  # Android构建验证
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    
    - name: Build Android App
      working-directory: mobile-app/novel-app
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: mobile-app/novel-app/app/build/outputs/apk/debug/*.apk

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified
    
    - name: Check dependencies
      run: |
        pip install safety
        safety check --full-report
      continue-on-error: true

  # 构建状态汇总
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test-python, lint, build-android, security]
    if: always()
    
    steps:
    - name: Check status
      run: |
        if [ "${{ needs.test-python.result }}" == "failure" ] || \
           [ "${{ needs.lint.result }}" == "failure" ] || \
           [ "${{ needs.build-android.result }}" == "failure" ]; then
          echo "CI failed"
          exit 1
        fi
        echo "CI passed"
