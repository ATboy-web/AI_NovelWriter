# AI_NovelWriter 生产环境 Docker Compose 配置
# 使用方法: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # Nginx 反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: novel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - ai-service
      - novel-service
      - frontend
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI 模型服务
  ai-service:
    build:
      context: ./backend
      dockerfile: ai-service/Dockerfile.prod
    container_name: novel-ai-service
    environment:
      - NODE_ENV=production
      - AI_MODEL_PATH=/models
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
    volumes:
      - ai-models:/models
      - ai-logs:/app/logs
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'

  # 小说生成服务
  novel-service:
    build:
      context: ./backend
      dockerfile: novel-service/Dockerfile.prod
    container_name: novel-service
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - DATABASE_URL=postgresql://novel:${DB_PASSWORD}@postgres:5432/noveldb
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - SECRET_KEY=${JWT_SECRET:?请先设置 JWT_SECRET（见 .env.example）}
      - API_KEYS=${API_KEYS:-}
      - LOG_LEVEL=info
    volumes:
      - novel-data:/app/data
      - novel-logs:/app/logs
    depends_on:
      - postgres
      - redis
      - ai-service
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端服务
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: novel-frontend
    restart: always

  # PostgreSQL 数据库
  postgres:
    image: postgres:15-alpine
    container_name: novel-postgres
    environment:
      - POSTGRES_DB=noveldb
      - POSTGRES_USER=novel
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novel -d noveldb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: novel-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: novel-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    restart: always

  # Grafana 可视化
  grafana:
    image: grafana/grafana:11.1.0
    container_name: novel-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    restart: always

volumes:
  ai-models:
  ai-logs:
  novel-data:
  novel-logs:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data:
