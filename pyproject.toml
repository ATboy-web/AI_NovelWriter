[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-novel-writer"
version = "3.0.0"
description = "AI 长篇小说创作工坊：15 类题材、5 Agent 协作、世界线分支与面板化工作台"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.24",
    "loguru>=0.7.0",
    "python-docx>=0.8.11",
    "pypdf>=3.0",
    "ebooklib>=0.18",
    "markdown>=3.4",
    "beautifulsoup4>=4.12",
    "Pillow>=9.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
# 【第二轮优化】chromadb 从强制依赖移入可选 extra。
# 依据：桌面端 app/ 全仓零处 import chromadb（installer/novel_app.spec 反而把它
# 列进 excludes），唯一使用者是 backend/novel-service（自带 requirements.txt
# 固定 chromadb==0.4.22 并做 try/except 可选导入）。此前它让每个桌面用户都
# 被迫安装一个数百 MB、永不使用的重型依赖。
vector = ["chromadb>=0.4.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
    "ruff>=0.1.0",
    "mypy>=1.0",
    # backend/tests 需要导入 backend/shared/middleware（FastAPI/Starlette 中间件）
    # 与 JWT 验签逻辑，否则该目录下的测试在 CI 中无法收集。
    "fastapi>=0.110",
    "PyJWT>=2.8",
]

# flat-layout 下存在多个顶层目录 (app / backend / shared / installer / ...),
# 若不加约束 setuptools 会因 "Multiple top-level packages discovered" 拒绝构建,
# 导致 `pip install -e ".[dev]"` 失败 (CI 曾因此静默回退到不完整的依赖安装)。
# 本项目仅 app/ 是需要安装的发行包, backend/ 为独立服务, shared/ 由服务各自引用。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = "test_*.py"
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
# 豁免项及理由（均为"无功能影响"的存量风格问题，不阻断 CI）：
#   E501 行长度      —— 由 formatter 处理，不作为硬性门禁
#   E701/E702 一行多语句 —— `if x: return` 类紧凑写法，属可读性偏好而非缺陷
#   W291/W293 行尾/空行含空白 —— 无功能影响。2026-09-16 全量 `ruff format` 后实测：
#       W293 已清零，仅剩 **10 处 W291**，且全部位于**字符串字面量内部**
#       （`app/format_converter.py` 的 HTML/CSS 模板 9 处 + `app/novel_agent.py:1730` 1 处）。
#       ruff 对这些也报 "No fixes available"（只能 `--unsafe-fixes`）——
#       即：修它就会改变模板内容，故**保留豁免**而不是"修掉"。
ignore = ["E501", "E701", "E702", "W291", "W293"]

[tool.ruff.lint.per-file-ignores]
# app/__init__.py 先求值 __version__ 再做子模块导入，以规避循环导入，属有意设计
"app/__init__.py" = ["E402"]
# 服务包初始化同样先设版本/元信息再导入子模块
"backend/ai-service/app/__init__.py" = ["E402"]
"backend/novel-service/app/__init__.py" = ["E402"]
# 该模块用 try/except ImportError 包裹一组导入，用来探测"新功能"子模块是否可用；
# 导入本身就是探测手段，不能删除（故豁免 F401）。
"backend/novel-service/app/api/new_features_routes.py" = ["F401"]
# 启动器同样用 try/except ImportError 探测 tkinter 子模块与 psutil 是否可用
# （`HAS_TKINTER` / `HAS_PSUTIL` 这两个开关就是探测结果），导入即探测，不能删除。
"installer/launcher.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
# UI 粘合层（Tkinter 窗口/事件/带副作用的网络与磁盘操作）不计入覆盖率：
# 这些模块难以单测；其可测的业务逻辑已抽取到独立模块（如 app/parsing.py）。
omit = [
    "app/panels/*",
    "app/fullscreen_writer.py",
    "app/ui_style.py",
    "app/navigation.py",
    "app/design_tokens.py",
    "app/writing_skills_panel.py",
    # P2-1 巨石拆分产生的功能域 Mixin
    "app/shell_ui.py",
    "app/lifecycle_ui.py",
    "app/generation_ui.py",
    "app/character_ui.py",
    "app/outline_ui.py",
    "app/chapter_ui.py",
    "app/editor_ui.py",
    "app/reader_ui.py",
    "app/timeline_ui.py",
    "app/toolkit_ui.py",
    "app/persistence_ui.py",
    "app/note_ui.py",
]

[tool.coverage.report]
show_missing = true
precision = 1