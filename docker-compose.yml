# AI自动写小说系统 - Docker Compose配置
# 生产环境配置
#
# 端口暴露约定（S3）：
#   - 只有 nginx(80/443) 与 frontend(3000) 绑定 0.0.0.0，作为唯一入口；
#   - 数据库、缓存、应用服务、全套监控均绑定 127.0.0.1，仅本机可访问。
#     此前它们全部发布到 0.0.0.0，同网段任意主机都能直连 PostgreSQL
#     （口令可能很弱）或直接调用 8002 生成接口消耗 API 配额。
#   - Redis / PostgreSQL 口令改为**必填**（`${VAR:?}`），不再有空默认值。

version: '3.8'

services:
  # ==================== 数据层 ====================
  
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: ai-novel-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_novel}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置POSTGRES_PASSWORD环境变量}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: ai-novel-redis
    # 强制要求口令（去掉 `:-` 空默认，避免"没配就裸奔"）
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?请设置REDIS_PASSWORD环境变量}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?请设置REDIS_PASSWORD环境变量}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    healthcheck:
      # M11: 不再用 `redis-cli -a <口令>`（口令会出现在容器进程 argv 里，
      # `ps` / `docker inspect` 可直接读到）。改用 redis-cli 官方支持的
      # REDISCLI_AUTH 环境变量传递，argv 中不再含明文口令。
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 应用层 ====================
  
  # AI模型服务
  ai-service:
    build:
      context: ./backend
      dockerfile: ai-service/Dockerfile
    container_name: ai-novel-ai-service
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?请设置POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_novel}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@redis:6379/0
      - LOCAL_MODEL_PATH=/app/models/local
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    volumes:
      - ./models:/app/models
      - ./logs/ai-service:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 小说生成服务
  novel-service:
    build:
      context: ./backend
      dockerfile: novel-service/Dockerfile
    container_name: ai-novel-novel-service
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?请设置POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_novel}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?请设置REDIS_PASSWORD环境变量}@redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      # 认证：本地一体化栈默认开启。此前默认 false 会导致"部署即无鉴权"，
      # 任何能访问 8002 的人都能直接调用生成接口并消耗 API 配额。
      # 若确实需要无鉴权的本地调试，请显式设置 ENABLE_AUTH=false。
      - ENABLE_AUTH=${ENABLE_AUTH:-true}
      - SECRET_KEY=${SECRET_KEY:-}
      - API_KEYS=${API_KEYS:-}
    volumes:
      - ./logs/novel-service:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - backend-net
      - frontend-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 前端服务
  frontend:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    container_name: ai-novel-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8001
      - REACT_APP_NOVEL_SERVICE_URL=http://localhost:8002
    depends_on:
      - ai-service
      - novel-service
    networks:
      - frontend-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx反向代理
  nginx:
    image: nginx:1.25-alpine
    container_name: ai-novel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - ai-service
      - novel-service
    networks:
      - frontend-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==================== 监控层 ====================
  
  # Node Exporter - 系统指标
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: ai-novel-node-exporter
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - monitoring-net
    restart: unless-stopped

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ai-novel-postgres-exporter
    ports:
      - "127.0.0.1:9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?请设置POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_novel}?sslmode=disable"
    depends_on:
      - postgres
    networks:
      - backend-net
      - monitoring-net
    restart: unless-stopped

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: ai-novel-redis-exporter
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置REDIS_PASSWORD环境变量}
    depends_on:
      - redis
    networks:
      - backend-net
      - monitoring-net
    restart: unless-stopped

  # cAdvisor - 容器监控
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ai-novel-cadvisor
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring-net
    restart: unless-stopped

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ai-novel-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring-net
      - backend-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ai-novel-alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - monitoring-net
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:11.1.0
    container_name: ai-novel-grafana
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?请设置GRAFANA_ADMIN_PASSWORD环境变量}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    networks:
      - monitoring-net
      - frontend-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Loki - 日志聚合
  loki:
    image: grafana/loki:3.0.0
    container_name: ai-novel-loki
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring-net
    restart: unless-stopped

  # Promtail - 日志收集
  promtail:
    image: grafana/promtail:3.0.0
    container_name: ai-novel-promtail
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml
      - /var/log:/var/log
      - ./logs:/app/logs
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring-net
    restart: unless-stopped

# ==================== 数据卷 ====================
volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  loki_data:

# ==================== 网络 ====================
networks:
  # 前端网络 - 对外暴露的服务
  frontend-net:
    driver: bridge
  
  # 后端网络 - 内部服务通信
  backend-net:
    driver: bridge
    internal: true
  
  # 监控网络 - 监控组件通信
  monitoring-net:
    driver: bridge
    internal: true
